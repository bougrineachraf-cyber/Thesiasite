<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thèsia — Test Google Calendar</title>
  <!-- Bibliothèque Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    button { padding: 10px 16px; font-size: 15px; cursor: pointer; margin-right: 8px; }
    pre { background: #f4f4f5; padding: 1rem; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>Test Google Calendar — Thèsia</h2>

  <button id="btn-auth">1. Se connecter avec Google</button>
  <button id="btn-list" disabled>2. Lister les 5 prochains événements</button>
  <button id="btn-create" disabled>3. Créer un événement test</button>

  <pre id="output">En attente de connexion...</pre>

  <script>
    const CLIENT_ID = "446198953820-uiacpqc78cq80be8lq5rga824miii6p6.apps.googleusercontent.com";
    const SCOPES = "https://www.googleapis.com/auth/calendar.events";

    let tokenClient;
    let accessToken = null;
    const output = document.getElementById("output");

    window.onload = () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (tokenResponse) => {
          if (tokenResponse.error) {
            output.textContent = "Erreur OAuth : " + JSON.stringify(tokenResponse, null, 2);
            return;
          }
          accessToken = tokenResponse.access_token;
          output.textContent = "Connecté avec succès ! Vous pouvez tester l'API.";
          document.getElementById("btn-list").disabled = false;
          document.getElementById("btn-create").disabled = false;
        },
      });
    };

    // 1. Demander l'autorisation à l'utilisateur
    document.getElementById("btn-auth").onclick = () => {
      tokenClient.requestAccessToken({ prompt: "consent" });
    };

    // 2. Lire les prochains événements
    document.getElementById("btn-list").onclick = async () => {
      output.textContent = "Chargement des événements...";
      const now = new Date().toISOString();
      const url = `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(now)}&maxResults=5&singleEvents=true&orderBy=startTime`;

      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      const data = await res.json();
      output.textContent = JSON.stringify(data.items || data, null, 2);
    };

    // 3. Créer un événement de test dans 1 heure
    document.getElementById("btn-create").onclick = async () => {
      output.textContent = "Création de l'événement...";
      const start = new Date(Date.now() + 60 * 60 * 1000);
      const end = new Date(start.getTime() + 30 * 60 * 1000);

      const event = {
        summary: "Test Thèsia — Google Calendar API",
        description: "Événement créé automatiquement depuis GitHub Pages.",
        start: { dateTime: start.toISOString() },
        end: { dateTime: end.toISOString() },
      };

      const res = await fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
        method: "POST",
        headers: {
          Authorization: `Bearer ${accessToken}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify(event),
      });
      const data = await res.json();
      output.textContent = "Événement créé :\n" + JSON.stringify(data, null, 2);
    };
  </script>
</body>
</html>
